# Tâches récurrentes de Solid Queue.
shared: &shared
  # Filet de sécurité tant que Gmail Pub/Sub et IMAP IDLE ne sont pas branchés (étape 2).
  sync_all_mailboxes:
    class: SyncAllMailboxesJob
    schedule: every 5 minutes
  # Journal d'accès : on garde un an.
  purge_access_logs:
    class: PurgeAccessLogsJob
    schedule: every day at 3am
  # Discussions avec l'agent : effacées après 90 jours sans activité (décision A8).
  purge_agent_chats:
    class: PurgeAgentChatsJob
    schedule: every day at 3:30am

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
