# Tâches récurrentes de Solid Queue.
shared: &shared
  # Filet de sécurité tant que Gmail Pub/Sub et IMAP IDLE ne sont pas branchés (étape 2).
  sync_all_mailboxes:
    class: SyncAllMailboxesJob
    schedule: every 5 minutes

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
